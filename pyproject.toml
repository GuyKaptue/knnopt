[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knnopt"
version = "0.1.0"
description = "A modular Python toolkit for benchmarking and visualizing optimal K values in KNN classification."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Guy Kaptue", email = "guykaptue24@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.66.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.900",
    "jupyter>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/GuyKaptue/knnopt"
Repository = "https://github.com/GuyKaptue/knnopt"
Documentation = "https://github.com/GuyKaptue/knnopt#readme"
Issues = "https://github.com/GuyKaptue/knnopt/issues"
